# Creates the GitHub release for a version tag (docs/RELEASING.md).
# Push a tag such as v0.3.0-beta on a merged main; notes come from CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::Tag ${tag} does not match package.json version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Take the notes from CHANGELOG.md
        run: scripts/release-notes.sh "${VERSION}" > release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${VERSION}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "TrainGrid ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            ${prerelease}
